<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaam Ki Lead – Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f6f4fa;--ink:#1d1630;--muted:#6b6480;--line:#e7e3ef;--brand:#5b2d8e;--on:#fff;--soft:#efe8f8;--accent:#f59a1f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121e;--surface:#201b2e;--ink:#f1edf8;--muted:#a59cbb;--line:#332c47;--brand:#a77be0;--on:#15121e;--soft:#2b2240}}
:root[data-theme="dark"]{--bg:#15121e;--surface:#201b2e;--ink:#f1edf8;--muted:#a59cbb;--line:#332c47;--brand:#a77be0;--on:#15121e;--soft:#2b2240}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.row{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:8px}
.sp{flex:1}

/* utility strip */
.util{background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.util .row{height:38px}
.util a,.citybtn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 8px;border-radius:8px;color:var(--muted)}
.util a:hover,.citybtn:hover{color:var(--ink)}
.util svg{width:14px;height:14px}.util .pin{color:var(--brand)}
.city{position:relative}
.citybtn[aria-expanded="true"] .chv{transform:rotate(180deg)}
.chv{transition:transform .15s}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;z-index:20;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(30,15,60,.16);display:none}
.menu.open{display:block}
.menu button{width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500}
.menu button:hover{background:var(--surface)}
.menu button[aria-selected="true"]{color:var(--brand);font-weight:700}

/* main bar */
.main .row{height:68px}
.logo{display:flex;align-items:center;flex:none;margin-right:8px}
.logo img,.logo svg{height:34px;width:auto;display:block}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-left:16px}
.seg a{padding:8px 16px;border-radius:10px;font-weight:600;color:var(--muted);transition:color .15s,background .15s}
.seg a:hover{color:var(--ink)}
.seg a[aria-current="page"]{background:var(--bg);color:var(--brand);box-shadow:0 1px 4px rgba(30,15,60,.18)}
.only-m{display:none}
.tag{margin-left:6px;font-size:11px;font-weight:700;background:var(--accent);color:#2a1a00;border-radius:6px;padding:1px 6px}

.ic{position:relative;width:42px;height:42px;display:grid;place-items:center;border:0;background:none;border-radius:12px;color:inherit}
.ic svg{width:21px;height:21px}.ic:hover{background:var(--surface)}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#2a1a00;font-size:11px;font-weight:700;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 18px;border-radius:12px;font-weight:600;font-size:14px;background:var(--brand);color:var(--on);white-space:nowrap}
.btn svg{width:16px;height:16px}.btn:hover{filter:brightness(1.08)}
.menu-btn{display:none}

@media (max-width:1100px){.hmd{display:none}}
@media (max-width:900px){
  .hm{display:none}
  .menu-btn{display:grid}
  .main .row{height:60px;padding:0 12px}
  .seg{display:none}
  .open .seg{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;margin:0;border-radius:0;border-width:0 0 1px;padding:8px 16px 14px;background:var(--bg)}
  .open .seg a{padding:13px 8px;border-radius:0;border-bottom:1px solid var(--line)}
  .open .seg a[aria-current="page"]{box-shadow:none;background:none}
  .open .only-m{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="chev" viewBox="0 0 12 12"><path d="m2 4 4 4 4-4"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
</svg>

<header class="hd" id="siteHeader">

  <!-- Utility strip -->
  <div class="util"><div class="row">
    <div class="city">
      <button class="citybtn" id="cityBtn" aria-haspopup="listbox" aria-expanded="false">
        <svg class="i pin"><use href="#pin"/></svg><span id="cityLabel">Kolkata</span><svg class="i chv"><use href="#chev"/></svg>
      </button>
      <div class="menu" id="cityMenu" role="listbox" aria-label="City"></div>
    </div>
    <div class="sp"></div>
    <a class="hmd" href="#">List a project</a>
    <a class="hm" href="#">Help</a>
    <a href="#">Sign in</a>
  </div></div>

  <!-- Main bar -->
  <div class="main"><div class="row">
    <button class="ic menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg class="i"><use href="#menu"/></svg></button>

    <a class="logo" href="/" aria-label="Kaam Ki Lead home">
      <!-- KEEP MY EXISTING LOGO HERE, UNCHANGED. This <img> is only a placeholder. -->
      <img src="logo.png" alt="Kaam Ki Lead">
    </a>

    <nav class="seg" aria-label="Main">
      <a href="#" aria-current="page">Home</a>
      <a href="#">Buy Leads</a>
      <a href="#">Projects</a>
      <a href="#">New launches <span class="tag">12</span></a>
      <a href="#" class="only-m">Shortlist</a>
      <a href="#" class="only-m">List a project</a>
    </nav>

    <div class="sp"></div>

    <button class="ic" aria-label="Search"><svg class="i"><use href="#search"/></svg></button>
    <a class="ic hm" href="#" aria-label="Shortlist, 3 saved"><svg class="i"><use href="#heart"/></svg><span class="badge">3</span></a>
    <a class="btn hmd" href="#"><svg class="i"><use href="#plus"/></svg>List a project</a>
  </div></div>
</header>

</body>
</html>
